<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — PeerScholars</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="app-shell">
  <div class="top-bar">PeerScholars · $12.99/hour tutoring · Verified high school tutors</div>
  <header class="site-header"><nav class="nav container"><a href="index.html" class="logo"><span class="logo-icon">PS</span>PeerScholars</a></nav></header>
  <main class="app-main">
    <div class="container">
      <div class="form-card login-card">
        <h1 style="margin:0 0 0.5rem;font-size:1.35rem;">Log in to PeerScholars</h1>
        <p class="field-hint" style="margin-bottom:1.25rem;">Parents, tutors, and administrators use the same login page.</p>
        <form id="login-form" class="inline-form">
          <div class="form-row"><label for="email">Email</label><input type="email" id="email" name="email" required autocomplete="email" placeholder="Use the email from sign-up"></div>
          <div class="form-row"><label for="password">Password <span class="field-hint">(admin only)</span></label><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Leave blank for student &amp; tutor accounts"></div>
          <p class="form-error" id="login-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-full">Log In</button>
        </form>
        <p style="text-align:center;margin-top:1rem;font-size:0.875rem;">No account? <a href="signup.html">Sign up as Student or Tutor</a></p>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
